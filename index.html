
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient To-Do App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .todo-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #5b4baf;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f3e7ff, #e5edff);
            color: #333;
            transition: transform 0.3s;
        }

        li:hover {
            transform: translateY(-3px);
        }

        li input[type="checkbox"] {
            accent-color: #764ba2;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        li span {
            flex: 1;
        }

        li input:checked + span {
            text-decoration: line-through;
            color: #999;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="todo-container">
        <h1>✨ My To-Do List</h1>

        <div class="input-box">
            <input type="text" placeholder="Enter a new task...">
            <button type="button">Add</button>
        </div>

        <ul>
            <li>
                <input type="checkbox">
                <span>📚 Study HTML and CSS</span>
            </li>
            <li>
                <input type="checkbox">
                <span>💻 Practice coding</span>
            </li>
            <li>
                <input type="checkbox">
                <span>🎯 Complete today's goals</span>
            </li>
            <li>
                <input type="checkbox">
                <span>📖 Read a book</span>
            </li>
        </ul>

        <div class="footer">
            Small steps every day! 🌈
        </div>
    </div>

</body>
</html>
